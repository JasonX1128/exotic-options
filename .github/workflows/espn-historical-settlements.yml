name: ESPN historical exotic settlements
# Use elapsed-game-clock time for average-margin settlements
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/espn-historical-settlements.yml']
permissions:
  contents: read
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run retrospective exotic-option payoffs
        run: python espn-options/historical_settlement.py --nba-date 20261016 --nba-limit 20 --strict
      - name: Upload settlements and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-historical-settlements-${{ github.run_id }}
          path: settlement-results/
          if-no-files-found: warn
          retention-days: 30
