name: ESPN collector smoke test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/espn-collector-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python espn-reliability/test_collector.py
      - name: Real ESPN historical NBA and CFB smoke tests
        run: python espn-reliability/smoke_historical.py
